<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Climate Detective: a game and tool to investigate climate trends in Mexico with NASA POWER data.">
<title>Climate Detective</title>
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect width=%2248%22 height=%2248%22 rx=%2210%22 fill=%22%230e1116%22/%3E%3Cg%3E%3Crect x=%229%22 y=%2210%22 width=%224.5%22 height=%2222%22 fill=%22%232166ac%22/%3E%3Crect x=%2213.5%22 y=%2210%22 width=%224.5%22 height=%2222%22 fill=%22%2392c5de%22/%3E%3Crect x=%2218%22 y=%2210%22 width=%224.5%22 height=%2222%22 fill=%22%23f7f7f7%22/%3E%3Crect x=%2222.5%22 y=%2210%22 width=%224.5%22 height=%2222%22 fill=%22%23f4a582%22/%3E%3Crect x=%2227%22 y=%2210%22 width=%224.5%22 height=%2222%22 fill=%22%23d6604d%22/%3E%3Crect x=%2231.5%22 y=%2210%22 width=%224.5%22 height=%2222%22 fill=%22%23b2182b%22/%3E%3C/g%3E%3Ccircle cx=%2222%22 cy=%2221%22 r=%2214%22 fill=%22none%22 stroke=%22%230e1116%22 stroke-width=%225%22/%3E%3Ccircle cx=%2222%22 cy=%2221%22 r=%2213%22 fill=%22none%22 stroke=%22%23f3f5f8%22 stroke-width=%223%22/%3E%3Cline x1=%2232%22 y1=%2231%22 x2=%2242%22 y2=%2241%22 stroke=%22%23f3f5f8%22 stroke-width=%225%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preload" href="fonts/Archivo-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/AtkinsonHyperlegibleNext-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <button id="homeBtn" class="brand" type="button"><span id="logoSlot" aria-hidden="true"></span><span data-i18n="title"></span></button>
    <button id="langBtn" class="lang" type="button"></button>
  </div>
</header>

<main>
  <!-- HOME -->
  <section id="screen-home" class="screen screen-home">
    <div id="stripesHero" class="stripes-hero bleed">
      <div class="band band-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div class="home-intro">
      <div class="home-title">
        <h1 data-i18n="title"></h1>
        <p class="home-sub" data-i18n="homeKicker"></p>
        <p class="lead" data-i18n="tagline"></p>
      </div>
      <div class="home-actions">
        <button id="playBtn" class="btn primary big" type="button" data-i18n="play"></button>
        <button id="archiveBtn" class="btn big-2" type="button" data-i18n="openArchive"></button>
        <p id="loadMsg" class="small" data-i18n="loading"></p>
        <p class="small" data-i18n="noLogin"></p>
      </div>
    </div>
    <div class="home-cases">
      <h2 data-i18n="casesTitle"></h2>
      <div id="levelList" class="levels"></div>
    </div>
    <div class="home-links"><button id="glossBtn" class="btn ghost" type="button" data-i18n="glossBtn"></button><button id="methodBtn" class="btn ghost" type="button" data-i18n="methodBtn"></button></div>
  </section>

  <!-- TUTORIAL / LEVEL (rendered by JS) -->
  <section id="screen-tutorial" class="screen" hidden></section>
  <section id="screen-level" class="screen" hidden></section>

  <!-- DETECTIVE'S ARCHIVE (challenge tool) -->
  <section id="screen-archive" class="screen" hidden>
    <div class="row"><button id="archiveBack" class="btn ghost" type="button" data-i18n="back"></button></div>
    <div class="card" id="archive">
      <h2 data-i18n="archiveTitle"></h2>
      <p data-i18n="archiveIntro"></p>
      <div class="controls">
        <label><span data-i18n="stepPlace"></span><select id="city"></select></label>
        <label><span data-i18n="stepVar"></span><select id="variable"></select></label>
        <label><span data-i18n="stepSeason"></span><select id="season"></select></label>
        <fieldset>
          <legend data-i18n="stepPeriod"></legend>
          <label><span data-i18n="from"></span><select id="from"></select></label>
          <label><span data-i18n="to"></span><select id="to"></select></label>
        </fieldset>
      </div>
      <p id="elev" class="small"></p>
      <h3 data-i18n="chartTitle"></h3>
      <div id="chartTypes" class="seg" role="group"></div>
      <svg id="chart" viewBox="0 0 360 230" role="img" aria-label="Chart"></svg>
      <div id="chartLegend"></div>
      <div id="result" class="result" aria-live="polite"></div>
    </div>
    <div class="card">
      <h2 data-i18n="defsTitle"></h2>
      <dl>
        <dt data-i18n="def_t2m_name"></dt><dd data-i18n="def_t2m"></dd>
        <dt data-i18n="def_prec_name"></dt><dd data-i18n="def_prec"></dd>
        <dt data-i18n="def_trend_name"></dt><dd data-i18n="def_trend"></dd>
        <dt data-i18n="def_p_name"></dt><dd data-i18n="def_p"></dd>
      </dl>
      <button id="archiveGloss" class="btn" type="button" data-i18n="glossOpenAll"></button>
    </div>
    <div class="card">
      <h2 data-i18n="methodTitle"></h2>
      <ul>
        <li data-i18n="method1"></li><li data-i18n="method2"></li><li data-i18n="method3"></li>
        <li data-i18n="method4"></li><li data-i18n="method5"></li><li data-i18n="method6"></li>
      </ul>
    </div>
  </section>

  <!-- GLOSSARY (rendered by js/glossary.js) -->
  <section id="screen-glossary" class="screen" hidden></section>

  <!-- METHOD, SOURCES AND CREDITS -->
  <section id="screen-method" class="screen" hidden>
    <div class="row"><button id="methodBack" class="btn ghost" type="button" data-i18n="back"></button></div>
    <div class="card">
      <h2 data-i18n="methodScreenTitle"></h2>
      <p data-i18n="mFiction"></p>
      <h3 data-i18n="mSecData"></h3>
      <ul><li data-i18n="method1"></li><li data-i18n="method2"></li><li data-i18n="method4"></li><li data-i18n="method5"></li></ul>
      <h3 data-i18n="mSecStats"></h3>
      <ul><li data-i18n="method3"></li><li data-i18n="mStats1"></li><li data-i18n="mStats2"></li></ul>
      <h3 data-i18n="mSecContent"></h3>
      <ul><li data-i18n="mRef1"></li><li data-i18n="mRef2"></li><li data-i18n="mRef3"></li><li data-i18n="mRef4"></li><li data-i18n="mRef5"></li><li data-i18n="mRef6"></li><li data-i18n="mRef7"></li></ul>
      <h3 data-i18n="mSecAI"></h3>
      <p data-i18n="mAI"></p>
      <h3 data-i18n="mSecArt"></h3>
      <p data-i18n="mArt"></p>
      <p class="small" data-i18n="mCode"></p>
    </div>
  </section>
</main>

<footer><p data-i18n="footer"></p></footer>

<script src="i18n/strings.js"></script>
<script src="js/stats.js"></script>
<script src="js/core.js"></script>
<script src="js/motion.js"></script>
<script src="js/icons.js"></script>
<script src="js/stripes.js"></script>
<script src="js/chart.js"></script>
<script src="js/art.js"></script>
<script src="js/cinematic.js"></script>
<script src="js/levels-data.js"></script>
<script src="js/glossary.js"></script>
<script src="js/archive.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/level.js"></script>
<script src="js/app.js"></script>
</body>
</html>
